---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filter-reading-deployment-dabash
spec:
  replicas: 2
  selector:
    matchLabels:
      app: filter-reading-dabash
  template:
    metadata:
      labels:
        app: filter-reading-dabash
    spec:
      containers:
        - image: northamerica-northeast2-docker.pkg.dev/dev-methods-tools/sofe4630u-dabash/filter-reading-dabash:latest
          name: filter-reading
          env:
            - name: GCP_PROJECT
              value: dev-methods-tools
            - name: TOPIC_NAME
              value: smartmeter-dabash
            - name: SUB_ID
              value: smartmeter-filter-sub-dabash
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: convert-reading-deployment-dabash
spec:
  replicas: 2
  selector:
    matchLabels:
      app: convert-reading-dabash
  template:
    metadata:
      labels:
        app: convert-reading-dabash
    spec:
      containers:
        - image: northamerica-northeast2-docker.pkg.dev/dev-methods-tools/sofe4630u-dabash/convert-reading-dabash:latest
          name: convert-reading
          env:
            - name: GCP_PROJECT
              value: dev-methods-tools
            - name: TOPIC_NAME
              value: smartmeter-dabash
            - name: SUB_ID
              value: smartmeter-convert-sub-dabash
---
